name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync script is shipped in the build
        run: test -f dist/sync.js
      - name: Syntax-check public/sync.js (not bundled by Vite)
        run: node --check public/sync.js
